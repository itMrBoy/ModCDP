<!doctype html>
<title>cdpHelper</title>
<style>
  body {
    margin: 24px;
    font:
      13px/1.4 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
    color: #111;
  }
  #refresh {
    float: right;
  }
  section {
    border-left: 1px solid #ddd;
    margin: 10px 0 10px 12px;
    padding-left: 12px;
  }
  h2,
  h3 {
    margin: 8px 0;
  }
  h2 {
    font-size: 16px;
  }
  h3 {
    font-size: 13px;
    color: #555;
  }
  summary {
    cursor: pointer;
    font-weight: 600;
  }
  pre {
    background: #f7f7f7;
    margin: 6px 0 10px;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
<button id="refresh">Refresh</button>
<h1>cdpHelper</h1>
<section id="cdphelper-bridge" hidden>
  <h2>cdpHelper</h2>
  <p id="cdphelper-status">Disconnected / 未连接</p>
  <form id="cdphelper-settings">
    <p>
      <label>Instance name / 实例名称 <input id="cdphelper-name" maxlength="80" /></label>
    </p>
    <p>
      <label>Local service / 本机服务 <input id="cdphelper-url" size="42" required /></label>
    </p>
    <button type="submit">Save and reconnect / 保存并重连</button>
    <span id="cdphelper-settings-result" role="status"></span>
  </form>
  <p>
    Load this extension in the browser window you want to control. Match the short instance ID above with the AI
    session's instance list.
  </p>
  <p>请在目标浏览器窗口安装此扩展，并通过上方实例短编号与 AI 会话列出的实例对应。</p>
  <p>
    <a href="https://github.com/itMrBoy/cdpHelper/releases" target="_blank" rel="noopener noreferrer"
      >Download and installation instructions / 下载与安装说明</a
    >
  </p>
</section>
<pre id="out">Loading...</pre>
<script type="module" src="options.js"></script>
