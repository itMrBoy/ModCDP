name: Test
on:
  pull_request:
  push:
jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the matching Chromium test fixture
        run: |
          pnpm exec playwright install --with-deps chromium
          browser_path="$(node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())")"
          echo "SNOW_TEST_BROWSER=$browser_path" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: pnpm run build
      - run: pnpm run build:plugin
      - run: pnpm run test:plugin
      - name: Run local SDK tests
        run: >-
          pnpm exec vitest run --fileParallelism=false --maxWorkers=1
          --exclude js/test/test.BBBrowserLauncher.ts
          --exclude js/test/test.BBExtensionInjector.ts
      - name: Run live Browserbase integration tests
        if: env.BROWSERBASE_API_KEY != ''
        run: >-
          pnpm exec vitest run js/test/test.BBBrowserLauncher.ts js/test/test.BBExtensionInjector.ts
          --fileParallelism=false --maxWorkers=1
      - name: Report unavailable Browserbase integration checks
        if: env.BROWSERBASE_API_KEY == ''
        run: |
          echo "::notice::Live Browserbase checks were not run because BROWSERBASE_API_KEY is not configured."
          echo "Browserbase cloud integration: not run (BROWSERBASE_API_KEY is not configured). Local SDK and plugin checks remain required." >> "$GITHUB_STEP_SUMMARY"
      - name: Run demos serially
        run: |
          for upstream in ws pipe; do
            for mode in direct loopback debugger; do
              node dist/js/examples/demo.js --"$mode" --upstream="$upstream"
            done
          done
          for mode in loopback debugger; do
            node dist/js/examples/demo.js --"$mode" --upstream=reversews
          done
      - run: node dist/js/examples/playwright.js
      - run: node dist/js/examples/puppeteer.js
