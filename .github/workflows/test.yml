name: Test
on:
  pull_request:
  push:
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CHROME_PATH: /usr/bin/chromium
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:plugin
      - run: pnpm run test:plugin
      - run: pnpm exec vitest run --fileParallelism=false --maxWorkers=1
      - name: Run demos serially
        run: |
          for upstream in ws pipe; do
            for mode in direct loopback debugger; do
              node dist/js/examples/demo.js --"$mode" --upstream="$upstream"
            done
          done
          for mode in loopback debugger; do
            node dist/js/examples/demo.js --"$mode" --upstream=reversews
          done
      - run: node dist/js/examples/playwright.js
      - run: node dist/js/examples/puppeteer.js
